{% macro password_input(id, name, required=false, placeholder='') %}
<div class="input-group">
    <input class="form-control" id="{{ id }}" name="{{ name }}" type="password"
           minlength="10" maxlength="128" autocomplete="new-password"
           placeholder="{{ placeholder }}" {% if required %}required{% endif %}>
    <button class="btn btn-outline-secondary" type="button" data-password-toggle="{{ id }}"
            aria-controls="{{ id }}" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
</div>
{% endmacro %}
