<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Phòng mạch Nhịp Sống{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/2.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#main-content">Đến nội dung chính</a>
    {% include "layout/header.html" %}
    <div class="app-shell">
        {% include "layout/sidebar.html" %}
        <div class="workspace">
            <main id="main-content" class="container-fluid py-4 px-lg-5">
                {% include "components/flashes.html" %}
                {% block content %}{% endblock %}
            </main>
            {% include "layout/footer.html" %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
