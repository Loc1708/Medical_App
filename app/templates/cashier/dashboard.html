{% extends "layout/role_dashboard.html" %}
{% block role_content %}


<h2 class="h5 mb-2">Thanh toán hóa đơn</h2>


<div class="d-flex justify-content-end mb-3">
  <button type="button" class="btn btn-outline-primary btn-sm">⟳ Làm mới</button>
</div>


<div>
  <div class="position-relative">
    <input type="text" id="kw" class="form-control" autocomplete="off"
      placeholder="🔍 Tìm kiếm bệnh nhân bằng mã hoặc tên..." oninput="searchPatientByCode()" />

    <ul id="list" class="list-group position-absolute w-100 d-none shadow-sm"
      style="z-index: 10; max-height: 250px; overflow-y: auto; top: 100%; margin-top: 4px;">
    </ul>
  </div>

  <select class="form-select mt-3">
    <option value="" selected disabled hidden> --Danh sách hóa đơn chưa thanh toán-- </option>
    <option value="Unity">Unity</option>
    <option value="Blender">Blender</option>
  </select>

  <div class="row justify-content-center mt-3 mx-auto" style="width: 80%;">
    <div class="card shadow-sm border">
      <div class="card-header bg-white text-center my-3 border-bottom">
        <h4 class="fw-bold">HÓA ĐƠN THANH TOÁN</h4>
      </div>

      <div class="card-body p-4">
        <div class="row mb-3 pb-3 border-bottom">
          <div class="col-6 mb-2 mb-sm-0">
            <span class="text-muted d-block small">Họ Tên Bệnh Nhân</span>
            <span class="fw-bold fs-6" id="hoTenBN">---</span>
          </div>

          <div class="col-6 text-sm-end">
            <span class="text-muted d-block small">Ngày Khám</span>
            <span class="fw-bold fs-6" id="ngayKham">---</span>
          </div>
        </div>

        <div class="bg-light p-3 rounded mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-secondary">Tiền khám:</span>
            <span id="tienKham">0 VNĐ</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-secondary">Tiền thuốc:</span>
            <span id="tienThuoc">0 VNĐ</span>
          </div>

          <hr class="my-2">
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-5">TỔNG TIỀN:</span>
            <span class="fw-bold fs-4 text-danger" id="tongTien">0 VNĐ</span>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button type="button" class="btn btn-primary px-4" id="btnThanhToan">
            &#10004; Xác nhận thanh toán
          </button>
        </div>
      </div>
    </div>
  </div>

</div>


{% endblock %}
