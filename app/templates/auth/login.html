{% extends "layout/base.html" %}
{% block title %}Đăng nhập · Phòng mạch Nhịp Sống{% endblock %}
{% block content %}
<div class="auth-panel panel">
    <span class="eyebrow">CHÀO MỪNG TRỞ LẠI</span>
    <h1 class="h3 mt-2">Đăng nhập</h1>
    <p class="text-muted">Sử dụng tài khoản được cấp hoặc tài khoản bệnh nhân đã đăng ký.</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input class="form-control mb-3" id="username" name="tenDangNhap" maxlength="80"
               value="{{ request.form.get('tenDangNhap', '') }}" autocomplete="username" required>
        <label class="form-label" for="password">Mật khẩu</label>
        <input class="form-control mb-4" id="password" name="matKhau" type="password"
               autocomplete="current-password" maxlength="128" required>
        <button class="btn btn-primary w-100">Đăng nhập</button>
    </form>
    <p class="mt-4 mb-0">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký bệnh nhân</a></p>
</div>
{% endblock %}
